<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweep — Videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:#F2F3F5;color:#0B0B0C}
a{color:#1A5DD8;text-decoration:none}a:hover{color:#1449AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F3F5; color: #0B0B0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; padding: 56px 0 0; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px">
<a href="Main.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0B0B0C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(16,24,40,0.06)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<button type="button" aria-label="Sort" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #FFFFFF; color: #0B0B0C; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(16,24,40,0.06)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></button>
</div>

<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">168 videos to sort</h1>
<span style="font-size: 14px; color: #5F646C">8.2 GB · AI picked an action for each</span>
</div>

<div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden">
<button type="button" aria-pressed="true" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 0; background: #0B0B0C; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap">Large · 47</button>
<button type="button" aria-pressed="false" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid #E1E4E8; background: #FFFFFF; color: #0B0B0C; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap">Accidental · 93</button>
<button type="button" aria-pressed="false" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid #E1E4E8; background: #FFFFFF; color: #0B0B0C; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap">Screen rec · 28</button>
</div>

<div style="flex-grow: 1; overflow: auto; padding: 0 16px 130px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{vids}}" as="v" hint-placeholder-count="5">
<div style="background: #FFFFFF; border-radius: 24px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 10px rgba(16,24,40,0.04)">
<div style="display: flex; gap: 12px; align-items: center">
<div style="position: relative; width: 84px; height: 84px; flex-shrink: 0; border-radius: 18px; overflow: hidden; background: {{v.bg}}">
<span style="position: absolute; left: 52%; top: 14%; width: 30%; aspect-ratio: 1; border-radius: 50%; background: {{v.sun}}"></span>
<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: {{v.ground}}"></span>
<span style="position: absolute; left: 29px; top: 24px; width: 26px; height: 26px; border-radius: 13px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="#0B0B0C"><path d="M8 5v14l11-7z"></path></svg></span>
<span style="position: absolute; right: 5px; bottom: 5px; padding: 1px 6px; border-radius: 7px; background: rgba(255,255,255,0.92); color: #0B0B0C; font-size: 10px; font-weight: 700">{{v.dur}}</span>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 8px">
<span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.name}}</span>
<span style="font-size: 14px; font-weight: 600; flex-shrink: 0">{{v.sizeLabel}}</span>
</div>
<span style="font-size: 13px; color: #5F646C; line-height: 1.35; display: flex; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A5DD8" stroke-width="2" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"></path></svg>{{v.note}}</span>
</div>
</div>
<div role="group" aria-label="{{v.groupLabel}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 16px; background: #F2F3F5">
<button type="button" onClick="{{v.setDel}}" aria-pressed="{{v.delP}}" style="height: 36px; border: 0; border-radius: 13px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: {{v.delBg}}; color: {{v.delFg}}; box-shadow: {{v.delSh}}">Delete</button>
<button type="button" onClick="{{v.setCmp}}" aria-pressed="{{v.cmpP}}" style="height: 36px; border: 0; border-radius: 13px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: {{v.cmpBg}}; color: {{v.cmpFg}}; box-shadow: {{v.cmpSh}}">{{v.cmpLabel}}</button>
<button type="button" onClick="{{v.setKeep}}" aria-pressed="{{v.keepP}}" style="height: 36px; border: 0; border-radius: 13px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: {{v.keepBg}}; color: {{v.keepFg}}; box-shadow: {{v.keepSh}}">Keep</button>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; flex-direction: column; gap: 8px; align-items: center">
<span style="padding: 6px 12px; border-radius: 14px; background: #FFFFFF; font-size: 13px; color: #2C3036; box-shadow: 0 4px 14px rgba(16,24,40,0.08)">Delete {{delN}} · Compress {{cmpN}} · Keep {{keepN}}</span>
<a href="Confirm.dc.html" style="align-self: stretch; height: 56px; border-radius: 28px; background: #0B0B0C; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(16,24,40,0.2)">Apply to {{actN}} videos · free {{freed}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const V = [
{ name: 'Birthday dinner', dur: '6:12', mb: 2400, save: 1700, bg: '#F4C6CF', sun: '#E77E95', ground: '#6E8B5A', note: '4K 60 fps — a 1080p copy stays sharp', ai: 'cmp' },
{ name: 'IMG_5530.MOV', dur: '0:48', mb: 312, save: 220, bg: '#2A2C30', sun: '#3A3D42', ground: '#1C1D20', note: 'Recorded in a pocket — 94% dark frames', ai: 'del' },
{ name: 'Concert encore', dur: '3:05', mb: 1100, save: 780, bg: '#3B2F6B', sun: '#F06BA8', ground: '#17122E', note: 'Duplicate — same clip re-saved from a chat', ai: 'del' },
{ name: 'Screen recording', dur: '2:40', mb: 640, save: 450, bg: '#DCE4F7', sun: '#1A5DD8', ground: '#FFFFFF', note: 'Screen recording, never reopened', ai: 'del' },
{ name: 'Beach day, Lombok', dur: '8:20', mb: 3200, save: 2200, bg: '#9FD0E8', sun: '#FFF1C2', ground: '#E8D3A8', note: 'Looks like a keeper — people, good light', ai: 'keep' }
];
const fmt = (mb) => mb >= 1000 ? (mb / 1000).toFixed(1) + ' GB' : mb + ' MB';
const st = this.state || {};
const pick = st.pick || V.map(v => v.ai);
const set = (i, val) => { const next = pick.slice(); next[i] = val; this.setState({ pick: next }); };
const sh = '0 1px 4px rgba(16,24,40,0.12)';
let freed = 0, delN = 0, cmpN = 0, keepN = 0;
const vids = V.map((v, i) => {
const p = pick[i];
if (p === 'del') { freed += v.mb; delN++; }
if (p === 'cmp') { freed += v.save; cmpN++; }
if (p === 'keep') { keepN++; }
const on = (k) => p === k;
return {
...v,
sizeLabel: fmt(v.mb),
cmpLabel: 'Compress −' + fmt(v.save),
groupLabel: 'Action for ' + v.name,
delP: on('del') ? 'true' : 'false',
cmpP: on('cmp') ? 'true' : 'false',
keepP: on('keep') ? 'true' : 'false',
delBg: on('del') ? '#FFFFFF' : 'transparent', delFg: on('del') ? '#C8261B' : '#5F646C', delSh: on('del') ? sh : 'none',
cmpBg: on('cmp') ? '#FFFFFF' : 'transparent', cmpFg: on('cmp') ? '#1A5DD8' : '#5F646C', cmpSh: on('cmp') ? sh : 'none',
keepBg: on('keep') ? '#FFFFFF' : 'transparent', keepFg: on('keep') ? '#0B0B0C' : '#5F646C', keepSh: on('keep') ? sh : 'none',
setDel: () => set(i, 'del'), setCmp: () => set(i, 'cmp'), setKeep: () => set(i, 'keep')
};
});
return { vids, delN, cmpN, keepN, actN: delN + cmpN, freed: fmt(freed) };
}
}
</script>
</body>
</html>
