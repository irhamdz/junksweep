<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweep — Review screenshots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:#F2F3F5;color:#0B0B0C}
a{color:#1A5DD8;text-decoration:none}a:hover{color:#1449AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F3F5; color: #0B0B0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; padding: 56px 0 0; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px">
<a href="Main.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0B0B0C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(16,24,40,0.06)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 17px; font-weight: 600">Screenshots</span>
<span style="font-size: 12px; color: #5F646C">2,418 items · 3.1 GB</span>
</div>
<button type="button" onClick="{{selectAll}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #FFFFFF; color: #0B0B0C; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(16,24,40,0.06)">{{selectAllLabel}}</button>
</div>

<div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden">
<button type="button" aria-pressed="true" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 0; background: #0B0B0C; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap">Safe to delete</button>
<button type="button" aria-pressed="false" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid #E1E4E8; background: #FFFFFF; color: #0B0B0C; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap">AI kept · 314</button>
<button type="button" aria-pressed="false" style="height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid #E1E4E8; background: #FFFFFF; color: #0B0B0C; font-family: inherit; font-size: 14px; font-weight: 500; white-space: nowrap">Older than 90 days</button>
</div>

<div style="margin: 0 16px; padding: 14px; border-radius: 22px; background: #FFFFFF; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 10px rgba(16,24,40,0.04)">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #EAF0FC; color: #1A5DD8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"></path></svg></span>
<span style="font-size: 14px; line-height: 1.4; color: #2C3036">Mostly expired OTP codes, receipts and memes. <strong style="font-weight: 600; color: #0B0B0C">314 look important</strong> and stay unselected.</span>
</div>

<sc-if value="{{offerBulk}}" hint-placeholder-val="{{true}}">
<div style="margin: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px">
<span style="font-size: 14px; color: #5F646C">{{n}} on screen selected</span>
<button type="button" onClick="{{selectBulk}}" style="height: 32px; padding: 0 4px; border: 0; background: transparent; color: #1A5DD8; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Select all 2,104 suggested</button>
</div>
</sc-if>
<sc-if value="{{bulk}}" hint-placeholder-val="{{false}}">
<div style="margin: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px">
<span style="font-size: 14px; color: #1A5DD8; font-weight: 600">All 2,104 suggestions selected</span>
<button type="button" onClick="{{clearBulk}}" style="height: 32px; padding: 0 4px; border: 0; background: transparent; color: #5F646C; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Undo</button>
</div>
</sc-if>

<div style="flex-grow: 1; overflow: auto; padding: 0 16px 120px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
<button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" aria-label="{{t.label}}" style="position: relative; height: 170px; padding: 0; border: 0; border-radius: 18px; overflow: hidden; cursor: pointer; background: {{t.bg}}; box-shadow: {{t.ring}}; font-family: inherit">
<span style="position: absolute; left: 12px; right: 12px; top: 16px; display: flex; flex-direction: column; gap: 7px">
<span style="display: block; height: 6px; width: 50%; border-radius: 3px; background: {{t.line}}"></span>
<span style="display: block; height: 30px; border-radius: 8px; background: #FFFFFF"></span>
<span style="display: block; height: 5px; width: 80%; border-radius: 3px; background: {{t.line}}"></span>
<span style="display: block; height: 5px; width: 62%; border-radius: 3px; background: {{t.line}}"></span>
<span style="display: block; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.7)"></span>
</span>
<span style="position: absolute; left: 7px; bottom: 7px; padding: 4px 8px; border-radius: 10px; background: rgba(255,255,255,0.92); color: #0B0B0C; font-size: 11px; font-weight: 600">{{t.tag}}</span>
<sc-if value="{{t.keep}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 7px; top: 7px; padding: 4px 8px; border-radius: 10px; background: #0B0B0C; color: #FFFFFF; font-size: 11px; font-weight: 600">AI: keep</span>
</sc-if>
<sc-if value="{{t.selected}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; right: 7px; top: 7px; width: 26px; height: 26px; border-radius: 13px; background: #1A5DD8; border: 2px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</sc-if>
<sc-if value="{{t.unselected}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; right: 7px; top: 7px; width: 26px; height: 26px; border-radius: 13px; border: 2px solid #FFFFFF; box-sizing: border-box; background: rgba(11,11,12,0.18)"></span>
</sc-if>
</button>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 8px">
<button type="button" aria-label="Move selected to an album" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 0; background: #FFFFFF; color: #0B0B0C; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 24px rgba(16,24,40,0.12)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
</button>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
<a href="Confirm.dc.html" style="flex-grow: 1; height: 56px; border-radius: 28px; background: #0B0B0C; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(16,24,40,0.2)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
Delete {{count}} · {{size}}</a>
</sc-if>
<sc-if value="{{noSel}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{yes}}" style="flex-grow: 1; height: 56px; border-radius: 28px; border: 0; background: #DDE0E6; color: #5F646C; font-family: inherit; font-size: 16px; font-weight: 600">Select items to delete</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T = [
{ bg: '#DCE4F7', tag: 'OTP code', keep: false },
{ bg: '#F6D5D3', tag: 'Meme', keep: false },
{ bg: '#D6EDE2', tag: 'Receipt', keep: false },
{ bg: '#E6DDF5', tag: 'Chat', keep: false },
{ bg: '#F6E7C4', tag: 'Map', keep: false },
{ bg: '#D5E6F3', tag: 'Boarding pass', keep: true },
{ bg: '#F8DCCB', tag: 'Promo', keep: false },
{ bg: '#DCE4F7', tag: 'OTP code', keep: false },
{ bg: '#F6D5D3', tag: 'Meme', keep: false },
{ bg: '#D6EDE2', tag: 'Receipt', keep: false },
{ bg: '#E3E5EA', tag: 'Document', keep: true },
{ bg: '#E6DDF5', tag: 'Post', keep: false },
{ bg: '#D5E6F3', tag: 'Transfer slip', keep: false },
{ bg: '#F6D5D3', tag: 'Meme', keep: false },
{ bg: '#F6E7C4', tag: 'Price list', keep: false }
];
const st = this.state || {};
const sel = st.sel || T.map(t => !t.keep);
const bulk = !!st.bulk;
const n = sel.filter(Boolean).length;
const allOn = sel.every(Boolean);
const tiles = T.map((t, i) => ({
...t,
line: 'rgba(11,11,12,0.14)',
selected: sel[i],
unselected: !sel[i],
pressed: sel[i] ? 'true' : 'false',
label: t.tag + (sel[i] ? ', selected' : ', not selected'),
ring: sel[i] ? 'inset 0 0 0 3px #1A5DD8' : 'none',
toggle: () => { const next = sel.slice(); next[i] = !next[i]; this.setState({ sel: next, bulk: false }); }
}));
return {
tiles,
n,
bulk,
offerBulk: !bulk,
hasSel: bulk || n > 0,
noSel: !bulk && n === 0,
yes: true,
count: bulk ? '2,104' : String(n),
size: bulk ? '2.7 GB' : Math.round(n * 1.3) + ' MB',
selectAllLabel: allOn ? 'Deselect all' : 'Select all',
selectAll: () => this.setState({ sel: T.map(() => !allOn), bulk: false }),
selectBulk: () => this.setState({ sel: T.map(t => !t.keep), bulk: true }),
clearBulk: () => this.setState({ bulk: false })
};
}
}
</script>
</body>
</html>
