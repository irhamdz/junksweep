<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweep — AI scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:#FFFFFF;color:#0B0B0C}
a{color:#1A5DD8;text-decoration:none}a:hover{color:#1449AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0B0B0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; padding: 56px 16px 34px; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<span style="width: 40px"></span>
<span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Sweep<sup style="font-size: 9px; margin-left: 1px">AI</sup></span>
<a href="Main.dc.html" aria-label="Cancel scan" style="width: 40px; height: 40px; border-radius: 20px; background: #F2F3F5; color: #0B0B0C; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div aria-hidden="true" style="position: relative; width: 358px; height: 300px; margin-top: 16px">
<sc-for list="{{orbit}}" as="o" hint-placeholder-count="10">
<span style="position: absolute; left: {{o.x}}; top: {{o.y}}; width: {{o.s}}; height: {{o.s}}; border-radius: 14px; border: 3px solid #FFFFFF; box-sizing: border-box; overflow: hidden; background: {{o.bg}}; transform: rotate({{o.rot}}); box-shadow: 0 6px 16px rgba(16,24,40,0.14); opacity: {{o.op}}">
<span style="position: absolute; left: 52%; top: 14%; width: 32%; aspect-ratio: 1; border-radius: 50%; background: {{o.sun}}"></span>
<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: {{o.ground}}"></span>
</span>
</sc-for>
<span style="position: absolute; left: 104px; top: 75px; width: 150px; height: 150px; border-radius: 75px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(16,24,40,0.12); display: flex; align-items: center; justify-content: center">
<svg width="150" height="150" viewBox="0 0 150 150" fill="none" style="position: absolute; inset: 0">
<circle cx="75" cy="75" r="62" stroke="#EEF0F3" stroke-width="8"></circle>
<circle cx="75" cy="75" r="62" stroke="#1A5DD8" stroke-width="8" stroke-linecap="round" stroke-dasharray="265 390" transform="rotate(-90 75 75)"></circle>
</svg>
<span style="position: relative; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">68%</span>
<span style="font-size: 12px; color: #5F646C; margin-top: 3px">9,780 / 14,382</span>
</span>
</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; margin-top: 14px">
<span style="font-size: 13px; color: #5F646C; display: flex; align-items: center; gap: 5px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path></svg>
On-device AI · nothing is uploaded</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">Finding the junk in your library</h1>
</div>

<div style="margin-top: 20px; background: #F2F3F5; border-radius: 22px; padding: 4px 16px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<sc-if value="{{r.done}}" hint-placeholder-val="{{true}}">
<span style="width: 20px; height: 20px; border-radius: 10px; background: #0B0B0C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</sc-if>
<sc-if value="{{r.busy}}" hint-placeholder-val="{{false}}">
<span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 2.5px solid #D5D9E0; border-top-color: #1A5DD8"></span>
</sc-if>
<span style="flex-grow: 1; font-size: 15px; font-weight: 500">{{r.name}}</span>
<span style="font-size: 14px; color: #5F646C">{{r.count}}</span>
</div>
</sc-for>
</div>

<a href="Main.dc.html" style="margin-top: auto; height: 54px; border-radius: 27px; background: #0B0B0C; color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px">See 13.2 GB found so far</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const S = [
{ bg: '#F2A97F', sun: '#FCE3B8', ground: '#3E6F7C' },
{ bg: '#FFFFFF', sun: '#1A5DD8', ground: '#E9EDF5' },
{ bg: '#9FD0E8', sun: '#FFF1C2', ground: '#E8D3A8' },
{ bg: '#1F2B4A', sun: '#E9E4C9', ground: '#0F1628' },
{ bg: '#F4C6CF', sun: '#E77E95', ground: '#6E8B5A' },
{ bg: '#A9C9B4', sun: '#F5F0D8', ground: '#3F6B4E' },
{ bg: '#3B2F6B', sun: '#F06BA8', ground: '#17122E' },
{ bg: '#C9D3E0', sun: '#FFFFFF', ground: '#56657A' },
{ bg: '#2A2C30', sun: '#3A3D42', ground: '#1C1D20' },
{ bg: '#EE9C7A', sun: '#FBE0B0', ground: '#35636F' }
];
const sizes = [48, 40, 52, 38, 46, 42, 50, 36, 44, 40];
const orbit = S.map((c, i) => {
const a = (i / S.length) * Math.PI * 2 - Math.PI / 2;
const s = sizes[i];
return {
...c,
s: s + 'px',
x: Math.round(179 + 128 * Math.cos(a) - s / 2) + 'px',
y: Math.round(150 + 118 * Math.sin(a) - s / 2) + 'px',
rot: ((i % 2 ? 1 : -1) * (4 + (i % 3) * 3)) + 'deg',
op: i === 8 ? '0.6' : '1'
};
});
const rows = [
{ name: 'Screenshots', count: '2,418', done: true },
{ name: 'Duplicates & blurry', count: '1,001', done: true },
{ name: 'Similar shots', count: '846 so far', done: false },
{ name: 'Videos', count: 'Queued', done: false }
];
return { orbit, rows: rows.map(r => ({ ...r, busy: !r.done })) };
}
}
</script>
</body>
</html>
